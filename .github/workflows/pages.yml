name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Dpto. field and simplified Excel
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<select id="dept"><option value="">-- Seleccione Dpto. --</option></select>'
          new='<input id="dept" list="depts" inputmode="numeric" autocomplete="off" placeholder="Escriba o seleccione Dpto. (ej. 103)">'
          s=s.replace(old,new,1)
          s=s.replace('</head>','<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>\n</head>',1)
          marker='<!-- Simplified Excel patch -->'
          if marker not in s:
              patch=r'''<!-- Simplified Excel patch -->
<script>
(function(){
  function val(v){ return String(v==null?'':v).trim(); }
  function normDept(v){ let q=val(v).toUpperCase().replace(/^DPTO?\.?\s*/,'').replace(/[^0-9]/g,''); if(q.length===1)q='00'+q; if(q.length===2)q='0'+q; return q; }
  function boolVal(v){ const q=val(v).toUpperCase(); return ['SI','SÍ','YES','TRUE','1','X'].includes(q); }
  function typeVal(v){ const q=val(v).toLowerCase(); if(q.includes('moto'))return 'moto'; if(q.includes('bicic'))return 'bicicleta'; if(q.includes('otro'))return 'otro'; return 'auto'; }
  function relVal(v){ const q=val(v).toLowerCase(); if(q.includes('inquilino')&&q.includes('extern'))return 'inquilino_externo'; if(q.includes('inquilino'))return 'inquilino_dpto'; if(q.includes('cochera')&&!q.includes('dpto'))return 'propietario_cochera'; if(q.includes('visita'))return 'visita'; return 'propietario_dpto'; }
  function headers(){ return ['Placa / código','Dpto','Sótano','Persona asociada','Tipo','Relación','Cocheras','Visita frecuente','Observaciones']; }
  async function downloadTemplate(){
    if(!window.ExcelJS){ alert('No se pudo cargar el generador Excel.'); return; }
    const wb=new ExcelJS.Workbook(); wb.creator='VERDI'; wb.created=new Date();
    const ws=wb.addWorksheet('REGISTRO VEHICULAR'); ws.views=[{state:'frozen',ySplit:1}];
    ws.addRow(headers());
    ws.getRow(1).font={bold:true}; ws.getRow(1).alignment={vertical:'middle',wrapText:true}; ws.getRow(1).height=32;
    ws.autoFilter={from:'A1',to:'I501'};
    const widths=[18,12,12,30,16,30,18,20,40]; widths.forEach((w,i)=>ws.getColumn(i+1).width=w);
    for(let r=2;r<=501;r++){
      ws.getCell(r,3).dataValidation={type:'list',allowBlank:true,formulae:['"S1,S2,S3,S4"']};
      ws.getCell(r,5).dataValidation={type:'list',allowBlank:true,formulae:['"Auto,Moto,Bicicleta,Otro"']};
      ws.getCell(r,6).dataValidation={type:'list',allowBlank:true,formulae:['"Propietario de Dpto.,Inquilino de Dpto.,Propietario de cochera sin Dpto.,Inquilino externo,Visita"']};
      ws.getCell(r,8).dataValidation={type:'list',allowBlank:true,formulae:['"Sí,No"']};
    }
    ws.getCell('A2').value='Ejemplo: ABC123'; ws.getCell('B2').value='306'; ws.getCell('C2').value='S1'; ws.getCell('D2').value='Nombre del propietario/inquilino'; ws.getCell('E2').value='Auto'; ws.getCell('F2').value='Propietario de Dpto.'; ws.getCell('G2').value='12,13'; ws.getCell('H2').value='No'; ws.getCell('I2').value='';
    ws.getRow(2).font={italic:true};
    const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='VERDI_Formato_Unico_Vehiculos.xlsx'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  async function importOneSheet(){
    const input=document.getElementById('excelFile'), out=document.getElementById('importMsg');
    if(!input||!input.files||!input.files[0]){ setMsg('importMsg','Seleccione un archivo Excel.'); return; }
    try{
      setMsg('importMsg','Procesando formato único...',true);
      const data=await input.files[0].arrayBuffer(); const wb=XLSX.read(data,{type:'array'}); const name=wb.SheetNames[0]; const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''});
      if(!rows.length){setMsg('importMsg','El archivo no contiene registros para cargar.');return;}
      let created=0,updated=0,skipped=0;
      for(const row of rows){
        const plate=val(row['Placa / código']||row.placa_codigo||row.placa||row.codigo).toUpperCase(); if(!plate||plate.startsWith('EJEMPLO:')){skipped++;continue;}
        const deptRaw=row['Dpto']??row.dpto??row.departamento??''; const dq=normDept(deptRaw); let did=null;
        if(dq){ let d=(depts||[]).find(x=>normDept(x.code)===dq); if(d)did=d.id; else { const q=await sb.from('departments').select('id,code').eq('building_id',BUILDING_ID).ilike('code',dq).maybeSingle(); if(q.error)throw q.error; if(q.data){did=q.data.id;} else {const insd=await sb.from('departments').insert({code:dq,building_id:BUILDING_ID}).select().single(); if(insd.error)throw insd.error; did=insd.data.id; depts.push(insd.data);} } }
        const person=val(row['Persona asociada']||row.persona_asociada||row.responsable); const relationship=relVal(row['Relación']||row.relacion); const vehicle_type=typeVal(row['Tipo']||row.tipo); const frequent=boolVal(row['Visita frecuente']??row.visita_frecuente); const basement=val(row['Sótano']||row.sotano).toUpperCase(); const spacesText=val(row['Cocheras']||row.cocheras); const observations=val(row['Observaciones']||row.observaciones);
        let existing=(vehicles||[]).find(x=>(x.plate||x.code_label||'').toUpperCase()===plate);
        const payload={plate,code_label:plate,responsible_name:person||null,relationship,vehicle_type,department_id:did,is_frequent:frequent,parking_required:!!spacesText,parking_basement:basement||null,authorized_parking_spaces:spacesText||null,description:observations||null,building_id:BUILDING_ID};
        if(existing){ const up=await sb.from('vehicles').update(payload).eq('id',existing.id).select().single(); if(up.error)throw up.error; updated++; }
        else { const ins=await sb.from('vehicles').insert(payload).select().single(); if(ins.error)throw ins.error; created++; }
      }
      await load(); setMsg('importMsg','Carga completada: '+created+' nuevos, '+updated+' actualizados, '+skipped+' omitidos.',true);
    }catch(e){ console.error(e); setMsg('importMsg','Error en la carga: '+(e.message||e)); }
  }
  document.addEventListener('click',function(e){
    if(e.target&&e.target.id==='template'){e.preventDefault();e.stopImmediatePropagation();downloadTemplate();}
    if(e.target&&e.target.id==='importExcel'){e.preventDefault();e.stopImmediatePropagation();importOneSheet();}
  },true);
})();
</script>
'''
              s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
