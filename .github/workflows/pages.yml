name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Dpto. field
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<select id="dept"><option value="">-- Seleccione Dpto. --</option></select>'
          new='<input id="dept" list="depts" inputmode="numeric" autocomplete="off" placeholder="Escriba o seleccione Dpto. (ej. 103)">'
          s=s.replace(old,new,1)
          marker='<!-- Dept search patch -->'
          if marker not in s:
              patch='''<!-- Dept search patch -->\n<script>\n(function(){\n  const t=setInterval(function(){\n    const el=document.getElementById('dept');\n    const list=document.getElementById('depts');\n    if(!el||!list||typeof depts==='undefined'||!Array.isArray(depts)||!depts.length)return;\n    list.innerHTML=depts.map(function(d){return '<option value="'+String(d.code).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'">';}).join('');\n    clearInterval(t);\n  },200);\n})();\n</script>\n'''
              s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
