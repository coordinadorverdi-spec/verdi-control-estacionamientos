<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERDI · Restablecer contraseña</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f3f6f8;color:#17202a}.top{background:#102a43;color:#fff;padding:16px}.top b{font-size:20px}.card{max-width:430px;margin:55px auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 10px;border-radius:8px}input{border:1px solid #cbd5e1}button{border:0;background:#102a43;color:white;font-weight:bold;cursor:pointer}.small{font-size:13px;color:#64748b}.ok{color:#087443;font-weight:bold}.err{color:#a61b1b;font-weight:bold}.hidden{display:none}</style></head><body><div class="top"><b>VERDI</b> · Restablecer contraseña</div><main class="card"><div id="loading">Validando enlace…</div><div id="form" class="hidden"><h2>Nueva contraseña</h2><p class="small">Ingrese una nueva contraseña para su cuenta de VERDI.</p><input id="p1" type="password" placeholder="Nueva contraseña"><input id="p2" type="password" placeholder="Confirmar contraseña"><button id="save">ACTUALIZAR CONTRASEÑA</button><p id="msg"></p></div></main><script>const SB_URL='https://ftskctrenpprvvujktps.supabase.co',SB_KEY='sb_publishable_5-7ujeSaqZF6nuHsB4es4g_3TxzFWk6',sb=window.supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id);function showError(x){$('loading').classList.add('hidden');$('form').classList.remove('hidden');$('msg').className='err';$('msg').textContent=x}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){$('loading').classList.add('hidden');$('form').classList.remove('hidden')}});sb.auth.getSession().then(({data,error})=>{if(error){showError(error.message);return}if(data.session){$('loading').classList.add('hidden');$('form').classList.remove('hidden')}else{showError('El enlace no es válido, ha expirado o ya fue utilizado. Solicite un nuevo correo de recuperación.')}});$('save').onclick=async()=>{let a=$('p1').value,b=$('p2').value;if(a.length<8){$('msg').className='err';$('msg').textContent='La contraseña debe tener al menos 8 caracteres.';return}if(a!==b){$('msg').className='err';$('msg').textContent='Las contraseñas no coinciden.';return}$('save').disabled=true;let {error}=await sb.auth.updateUser({password:a});if(error){$('save').disabled=false;$('msg').className='err';$('msg').textContent=error.message;return}$('msg').className='ok';$('msg').textContent='Contraseña actualizada correctamente.';setTimeout(()=>{sb.auth.signOut().finally(()=>location.href='https://coordinadorverdi-spec.github.io/verdi-control-estacionamientos/')},1200)}</script></body></html>
