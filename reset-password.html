<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERDI · Nueva contraseña</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f3f6f8}.top{background:#102a43;color:#fff;padding:16px}.card{max-width:430px;margin:55px auto;background:#fff;padding:22px;border-radius:14px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px}input{border:1px solid #cbd5e1}button{border:0;background:#102a43;color:#fff;font-weight:bold}.err{color:#a61b1b;font-weight:bold}.ok{color:#087443;font-weight:bold}</style></head><body><div class="top"><b>VERDI</b> · Nueva contraseña</div><main class="card"><h2>Restablecer contraseña</h2><p>Ingrese y confirme su nueva contraseña.</p><input id="p1" type="password" placeholder="Nueva contraseña"><input id="p2" type="password" placeholder="Confirmar contraseña"><button id="save">ACTUALIZAR CONTRASEÑA</button><p id="msg"></p></main><script>const sb=window.supabase.createClient('https://ftskctrenpprvvujktps.supabase.co','sb_publishable_5-7ujeSaqZF6nuHsB4es4g_3TxzFWk6');const $=x=>document.getElementById(x);let ready=false;function show(c,x){$('msg').className=c;$('msg').textContent=x}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)ready=true});sb.auth.getSession().then(({data,error})=>{if(error)show('err',error.message);else if(data.session)ready=true;else show('err','El enlace no es válido o ha expirado. Solicite un nuevo correo desde VERDI.')});$('save').onclick=async()=>{if(!ready){show('err','El enlace de recuperación no está activo.');return}let a=$('p1').value,b=$('p2').value;if(a.length<8){show('err','La contraseña debe tener al menos 8 caracteres.');return}if(a!==b){show('err','Las contraseñas no coinciden.');return}$('save').disabled=true;let r=await sb.auth.updateUser({password:a});if(r.error){$('save').disabled=false;show('err',r.error.message);return}show('ok','Contraseña actualizada correctamente. Ya puede ingresar a VERDI.');setTimeout(()=>location.href='./index.html',1200)}</script></body></html>
